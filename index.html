<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>남들과 다른 내 취향</title>
<style>
:root { --bg:#faf7f2; --ink:#1d1a16; --muted:#6b645b; --accent:#c2410c; --card:#fff; --line:#e7e0d6 }
@media (prefers-color-scheme: dark) { :root { --bg:#16130f; --ink:#f2ede6; --muted:#a59d92; --accent:#fb923c; --card:#211d18; --line:#3a332b } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif }
main { max-width:520px; margin:0 auto; padding:48px 16px; display:grid; gap:18px }
h1 { font-size:30px; margin:0 } p { margin:0; color:var(--muted) }
a { display:block; text-align:center; text-decoration:none; font-weight:700; font-size:18px; padding:18px; border-radius:14px; background:var(--accent); color:#fff }
a.alt { background:var(--card); color:var(--accent); border:1px solid var(--accent) }
small { color:var(--muted) }
</style></head>
<body><main>
<h1>남들과 다른 내 취향</h1>
<p>두 얼굴 중 더 끌리는 쪽을 고르는 게임이에요. 어떤 얼굴을 볼지 고르세요.</p>
<a href="female/">여자 얼굴로 하기</a>
<a class="alt" href="male/">남자 얼굴로 하기</a>
<small>얼굴은 모두 AI가 만든 가상 인물이에요. 이름과 고른 기록은 연구용으로만 저장돼요.</small>
</main></body></html>
